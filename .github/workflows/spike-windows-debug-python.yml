name: Spike - Q2 PBS Windows build

# TEMPORARY, for #183.
#
# Q1 (answered): a debug CPython makes Windows `-c dbg` link without the _DEBUG
# workaround. Recorded in #183; the probe that proved it is kept at
# spike/windows_debug_python/embed_probe.cpp as the acceptance test for whatever
# distribution Q2 eventually produces.
#
# Q2 (this workflow): can we drive python-build-standalone's Windows pipeline at
# all? It has no debug build option -- `--options` accepts only noopt/pgo and
# their freethreaded pairs, and `configuration="Release"` is hardcoded in
# cpython-windows/build.py. Before patching any of that, reproduce their build
# unmodified so we know the harness runs and what an iteration costs.
#
# Delete this workflow, and spike/, once #183 has its answer.

on:
  push:
    branches: [ "spike/**" ]
  workflow_dispatch:
    inputs:
      pbs_ref:
        description: python-build-standalone ref
        default: main
        type: string
      python:
        description: --python value
        default: cpython-3.14
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same reason as patch 0002: the checkout is on D: and uv's default cache is
  # on C:, so uv cannot hardlink. We drive build.py directly rather than running
  # PBS's own workflow, so the patch alone would not cover this run.
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
  PBS_REF: ${{ inputs.pbs_ref || 'main' }}
  # Q2 is testing the debug option patch 0003 adds. workflow_dispatch only
  # lists workflows present on the default branch, so until this merges the
  # push trigger and this default are how it runs.
  # PBS_PYTHON comes from the matrix; see the strategy block below.

jobs:
  pbs-baseline:
    # 3.15 needs VS2026 and everything older needs VS2022, and build.py
    # resolves --vs by asking vswhere for a matching range, so the runner has
    # to carry it. windows-latest and windows-2025 both resolve to the VS2026
    # image now, leaving windows-2022 as the only free label with VS2022.
    runs-on: >-
      ${{ matrix.arch == 'arm64'
          && (matrix.python == 'cpython-3.15' && 'windows-11-vs2026-arm' || 'windows-11-arm')
          || (matrix.python == 'cpython-3.15' && 'windows-2025-vs2026' || 'windows-2022') }}
    strategy:
      fail-fast: false
      matrix:
        # Every configuration patch 0005 turns on, across the versions
        # ci-targets.yaml lists for each: x64 and x86 for both options, arm64
        # for plain debug from 3.11. arm64 appears twice, cross-compiled as PBS
        # builds it today and native on the free arm64 runner.
        include: ${{ fromJson('[{"python":"cpython-3.10","arch":"x64","options":"debug","build":"native"},{"python":"cpython-3.10","arch":"x86","options":"debug","build":"native"},{"python":"cpython-3.11","arch":"x64","options":"debug","build":"native"},{"python":"cpython-3.11","arch":"x86","options":"debug","build":"native"},{"python":"cpython-3.12","arch":"x64","options":"debug","build":"native"},{"python":"cpython-3.12","arch":"x86","options":"debug","build":"native"},{"python":"cpython-3.13","arch":"x64","options":"debug","build":"native"},{"python":"cpython-3.13","arch":"x86","options":"debug","build":"native"},{"python":"cpython-3.14","arch":"x64","options":"debug","build":"native"},{"python":"cpython-3.14","arch":"x86","options":"debug","build":"native"},{"python":"cpython-3.15","arch":"x64","options":"debug","build":"native"},{"python":"cpython-3.15","arch":"x86","options":"debug","build":"native"},{"python":"cpython-3.13","arch":"x64","options":"freethreaded+debug","build":"native"},{"python":"cpython-3.13","arch":"x86","options":"freethreaded+debug","build":"native"},{"python":"cpython-3.14","arch":"x64","options":"freethreaded+debug","build":"native"},{"python":"cpython-3.14","arch":"x86","options":"freethreaded+debug","build":"native"},{"python":"cpython-3.15","arch":"x64","options":"freethreaded+debug","build":"native"},{"python":"cpython-3.15","arch":"x86","options":"freethreaded+debug","build":"native"},{"python":"cpython-3.11","arch":"arm64","options":"debug","build":"native"},{"python":"cpython-3.12","arch":"arm64","options":"debug","build":"native"},{"python":"cpython-3.13","arch":"arm64","options":"debug","build":"native"},{"python":"cpython-3.14","arch":"arm64","options":"debug","build":"native"},{"python":"cpython-3.15","arch":"arm64","options":"debug","build":"native"},{"python":"cpython-3.13","arch":"arm64","options":"freethreaded+debug","build":"native"},{"python":"cpython-3.14","arch":"arm64","options":"freethreaded+debug","build":"native"},{"python":"cpython-3.15","arch":"arm64","options":"freethreaded+debug","build":"native"}]') }}
    name: ${{ matrix.python }} ${{ matrix.arch }} --options ${{ matrix.options }}
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
    # Ours, for spike/pbs_patches.
    - uses: actions/checkout@v7

    - name: Check out python-build-standalone
      uses: actions/checkout@v7
      with:
        repository: astral-sh/python-build-standalone
        ref: ${{ env.PBS_REF }}
        path: pbs

    # The series we intend to upstream, applied in order. Keep each patch one
    # self-contained change so it can be sent on its own.
    - name: Apply the patch series
      shell: bash
      working-directory: pbs
      run: |
        shopt -s nullglob
        for p in ../spike/pbs_patches/*.patch; do
          echo "=== $(basename "$p")"
          git apply --verbose "$p"
        done
        git --no-pager diff --stat

    # PC/layout runs the interpreter it just built, so every target builds on
    # its own architecture and vcvars follows the host.
    - name: Resolve toolchain for ${{ matrix.arch }}
      shell: bash
      run: |
        case "${{ matrix.arch }}" in
          x64)    vcvars=vcvars64.bat ;;
          x86)    vcvars=vcvars32.bat ;;
          arm64)  vcvars=vcvarsarm64.bat ;;
        esac
        echo "VCVARS=$vcvars" >> "$GITHUB_ENV"
        echo "vcvars=$vcvars"

    - name: Report free disk space
      shell: pwsh
      run: Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free | Format-Table

    # build.py shells out to autoconf/libtool for libffi.
    - name: Install Cygwin
      uses: cygwin/cygwin-install-action@v6
      with:
        packages: autoconf automake libtool

    - uses: astral-sh/setup-uv@v9.0.0
      with:
        enable-cache: false

    - name: Cache the pythonbuild crate
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          pbs/target
        key: pbs-crate-${{ hashFiles('pbs/Cargo.lock') }}

    # The real workflow builds this in a separate job and downloads it to the
    # repo root, where build.py expects to find it.
    - name: Build pythonbuild.exe
      shell: pwsh
      working-directory: pbs
      run: |
        cargo build --release
        Copy-Item target/release/pythonbuild.exe . -Force
        ./pythonbuild.exe --help | Select-Object -First 3

    # Upstream does this before activating VC++, or binary packages compile wrong.
    - name: Bootstrap the Python environment
      shell: pwsh
      working-directory: pbs
      run: uv run --no-dev build.py --help

    # build.py already treats build/ as a cache: it skips OpenSSL and libffi
    # when their archives exist, and the downloaded perl/nasm/jom live there
    # too. OpenSSL alone is ~15 minutes at jom /J 4, so restoring this is the
    # difference between a 20 minute iteration and a 5 minute one.
    #
    # Keyed on downloads.py, which pins the dependency versions, rather than on
    # build.py, so the patch series does not invalidate it. Bump v1 by hand if a
    # patch ever changes how a dependency is built.
    #
    # The options go in the key because build.py names the dependency archives
    # after them (openssl-3.5-<triple>-<options>-no-uplink.tar), so a debug run
    # would hit a noopt cache, rebuild what it needs, and then decline to save.
    - name: Restore the PBS dependency cache
      id: pbs-cache
      uses: actions/cache/restore@v4
      with:
        path: pbs/build
        key: pbs-build-v1-${{ matrix.python }}-${{ matrix.arch }}-${{ matrix.options }}-${{ hashFiles('pbs/pythonbuild/downloads.py') }}
        restore-keys: pbs-build-v1-${{ matrix.python }}-${{ matrix.arch }}-${{ matrix.options }}-

    - name: Build ${{ matrix.python }} ${{ matrix.arch }} --options ${{ matrix.options }}
      shell: cmd
      working-directory: pbs
      run: |
        rem ci-targets.yaml pins vs_version 2022 for this triple and overrides
        rem to 2026 only from 3.15. Older CPython has no BasePlatformToolset
        rem mapping for VisualStudioVersion 18.0, so it falls through to v140
        rem and fails with MSB8020.
        set MATRIX_VS=2022
        if "%MATRIX_PYTHON%"=="cpython-3.15" set MATRIX_VS=2026
        echo building %MATRIX_PYTHON% %MATRIX_ARCH% --options %MATRIX_OPTIONS% with VS %MATRIX_VS% via %VCVARS%
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSPATH=%%i
        call "%VSPATH%\VC\Auxiliary\Build\%VCVARS%" || exit /b 1
        uv run --no-dev build.py --python %MATRIX_PYTHON% --sh c:\cygwin\bin\sh.exe --options %MATRIX_OPTIONS% --vs %MATRIX_VS%
      env:
        MATRIX_PYTHON: ${{ matrix.python }}
        MATRIX_ARCH: ${{ matrix.arch }}
        MATRIX_OPTIONS: ${{ matrix.options }}

    # Only on success, so a half-built dependency cannot poison later runs.
    - name: Save the PBS dependency cache
      if: success() && steps.pbs-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: pbs/build
        key: ${{ steps.pbs-cache.outputs.cache-primary-key }}

    - name: What it produced
      if: always()
      shell: pwsh
      working-directory: pbs
      run: |
        Get-ChildItem dist -ErrorAction SilentlyContinue |
          Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table
        if (Test-Path build/build.log) {
          Write-Host "=== tail of build.log ==="
          Get-Content build/build.log -Tail 40
        }

    - name: Validate the distribution
      if: success()
      shell: pwsh
      working-directory: pbs
      run: |
        $dists = Resolve-Path -Path "dist/*.tar.zst" -Relative
        ./pythonbuild.exe validate-distribution $dists

    # Everything below answers what the build alone cannot: does the
    # distribution work, and does it give us something release cannot?

    - name: Unpack and inspect the distribution
      shell: pwsh
      working-directory: pbs
      run: uv run --no-project --script ../spike/windows_debug_python/inspect_dist.py

    # The claim #183 rests on: /MDd defines _DEBUG, so pyconfig.h asks for
    # python314_d.lib through its own #pragma comment(lib, ...). No workaround
    # here, only a LIBPATH. If this links, python_h.h can be deleted.
    #
    # GIL_DEFINE comes from the previous step and is /DPy_GIL_DISABLED=1 for a
    # free-threaded distribution, empty otherwise. That is not a workaround but
    # the documented contract from 3.14 on: the installed pyconfig.h no longer
    # declares which build it belongs to, so the consumer supplies it.
    - name: Link an embedder against it, with no _DEBUG workaround
      shell: cmd
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSPATH=%%i
        call "%VSPATH%\VC\Auxiliary\Build\%VCVARS%" || exit /b 1
        cl /nologo /std:c++20 /EHsc /MDd /Zi /utf-8 %GIL_DEFINE% ^
           /I pbs\unpacked\python\install\include ^
           spike\windows_debug_python\embed_probe.cpp ^
           /Fe:embed_probe.exe ^
           /link /LIBPATH:pbs\unpacked\python\install\libs || exit /b 1

    - name: Run the embedder
      shell: cmd
      run: |
        set PATH=%CD%\pbs\unpacked\python\install;%PATH%
        embed_probe.exe %CD%\pbs\unpacked\python\install
