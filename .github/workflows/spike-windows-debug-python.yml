name: Spike - Windows debug CPython

# TEMPORARY. Q1 of #183: does a real debug CPython make Windows `-c dbg` work?
# Builds stock CPython with PCbuild in Debug, then compiles an embedder /MDd
# against it with no _DEBUG workaround. Deliberately avoids Bazel, rules_python
# and python-build-standalone so that a failure points at exactly one thing.
#
# No disk cleanup: setup_linux frees space for the 12 GB LLVM toolchain and the
# Bazel caches, and this job fetches neither. The free-space report below is
# there to prove that rather than assume it.
#
# Delete this workflow, and spike/, once #183 has its answer.

on:
  # Runs on any spike/** branch. workflow_dispatch only lists a workflow that
  # exists on the default branch, so pushing the branch is the trigger until
  # this lands on main.
  push:
    branches: [ "spike/**" ]
  workflow_dispatch:
    inputs:
      cpython_ref:
        description: CPython tag to build
        default: v3.14.4
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CPYTHON_REF: ${{ inputs.cpython_ref || 'v3.14.4' }}

jobs:
  debug-cpython:
    runs-on: windows-latest
    name: Build debug CPython and probe embedding
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    - name: Report free disk space
      shell: pwsh
      run: Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free | Format-Table

    - name: Check out CPython ${{ env.CPYTHON_REF }}
      uses: actions/checkout@v7
      with:
        repository: python/cpython
        ref: ${{ env.CPYTHON_REF }}
        path: cpython
        fetch-depth: 1

    - name: Cache debug build
      id: cpython-cache
      uses: actions/cache@v4
      with:
        path: cpython/PCbuild/amd64
        key: cpython-debug-${{ env.CPYTHON_REF }}-x64-v1

    # -d Debug, -e fetch/build externals, tkinter is dead weight here.
    - name: Build debug CPython
      if: steps.cpython-cache.outputs.cache-hit != 'true'
      shell: cmd
      working-directory: cpython/PCbuild
      run: build.bat -d -e -p x64 --no-tkinter

    - name: Show what the debug build produced
      shell: cmd
      run: |
        dir cpython\PCbuild\amd64\python*_d.* 2>nul
        if not exist cpython\PCbuild\amd64\python314_d.lib (
          echo MISSING python314_d.lib - the rest of this run is meaningless
          exit /b 1
        )

    # The whole point: /MDd defines _DEBUG, pyconfig.h asks for python314_d.lib
    # via #pragma comment(lib, ...), and only a LIBPATH is supplied. If this
    # links, the workaround in modules/cpp_py_bootstrap_app is unnecessary.
    - name: Compile the probe /MDd, no _DEBUG workaround
      shell: cmd
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSPATH=%%i
        call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
        cl /nologo /std:c++20 /EHsc /MDd /Zi /utf-8 ^
           /I cpython\Include /I cpython\PC ^
           spike\windows_debug_python\embed_probe.cpp ^
           /Fe:embed_probe.exe ^
           /link /LIBPATH:cpython\PCbuild\amd64 || exit /b 1

    - name: Run the probe
      shell: cmd
      run: |
        set PATH=%CD%\cpython\PCbuild\amd64;%PATH%
        embed_probe.exe %CD%\cpython

    # windows-latest is now the VS2026 image, which carries both the 14.51
    # (VS2026) and 14.44 (VS2022 17.14) toolsets. Docs still document only
    # /std:c++23preview, so probe what cl actually accepts: .bazelrc pins
    # --cxxopt=/std:c++23preview and would drop the suffix if it were real.
    - name: MSVC /std support
      continue-on-error: true
      shell: cmd
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSPATH=%%i
        call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" >nul || exit /b 1
        echo === toolset picked by vswhere -latest ===
        cl 2>&1 | findstr /C:"Version"
        echo int main(){return 0;} > %TEMP%\std_probe.cpp
        for %%s in (c++20 c++23 c++23preview c++latest) do (
          cl /nologo /std:%%s /c /Fo%TEMP%\ %TEMP%\std_probe.cpp >nul 2>&1 && echo   /std:%%s accepted || echo   /std:%%s REJECTED
        )

    # Informational, for #183's Windows wheel question: which tags does a debug
    # interpreter accept, and can it install a release-ABI wheel? Never fatal.
    - name: Wheel compatibility of the debug interpreter
      continue-on-error: true
      shell: cmd
      run: |
        set PATH=%CD%\cpython\PCbuild\amd64;%PATH%
        cpython\PCbuild\amd64\python_d.exe -m ensurepip
        echo === compatible tags ===
        cpython\PCbuild\amd64\python_d.exe -m pip debug --verbose
        echo === install a release-ABI wheel ===
        cpython\PCbuild\amd64\python_d.exe -m pip install --only-binary=:all: markupsafe pyyaml
        echo === why release wheels do not work: extension suffixes ===
        cpython\PCbuild\amd64\python_d.exe -c "import importlib.machinery as m; print('  EXTENSION_SUFFIXES:', m.EXTENSION_SUFFIXES)"
        echo === what the release wheels actually put on disk ===
        cpython\PCbuild\amd64\python_d.exe -c "import pathlib,sysconfig; sp=pathlib.Path(sysconfig.get_paths()['purelib']); print('\n'.join('  '+str(p.relative_to(sp)) for p in sorted(sp.rglob('*.pyd'))) or '  (no .pyd found)')"
        echo === can the debug interpreter import them? ===
        rem Both packages fall back to pure Python, so import the extension
        rem directly; a silent fallback would otherwise look like success.
        cpython\PCbuild\amd64\python_d.exe -c "import markupsafe._speedups" && echo   markupsafe._speedups: loaded || echo   markupsafe._speedups: NOT loaded
        cpython\PCbuild\amd64\python_d.exe -c "import _yaml" && echo   _yaml: loaded || echo   _yaml: NOT loaded

  # Which MSVC toolset does *Bazel* pick? vswhere and MSBuild each answered
  # differently on this image (14.51 and 14.44), and neither speaks for Bazel.
  # CC_CONFIGURE_DEBUG is in the cc_autoconf repo rule's `environ`, so setting it
  # both invalidates the rule and makes it report its own choice.
  msvc-selection:
    runs-on: windows-latest
    name: Which MSVC toolset Bazel picks
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
    - uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true

    # A scratch module, so the answer is about the image and not our dep graph.
    - name: Create a minimal workspace
      shell: bash
      run: |
        mkdir -p msvc_probe
        cd msvc_probe
        printf '9.2.0\n' > .bazelversion
        printf 'bazel_dep(name = "rules_cc", version = "0.2.22")\n' > MODULE.bazel
        printf 'load("@rules_cc//cc:defs.bzl", "cc_binary")\ncc_binary(name = "probe", srcs = ["probe.cc"])\n' > BUILD.bazel
        printf 'int main() { return 0; }\n' > probe.cc

    - name: Ask Bazel which toolset it chose
      shell: pwsh
      working-directory: msvc_probe
      env:
        CC_CONFIGURE_DEBUG: "1"
      run: |
        bazel --output_base=C:/bzl_probe build //:probe 2>&1 | Tee-Object -FilePath bazel.log
        Write-Host "=== selection trace ==="
        Select-String -Path bazel.log -Pattern "vswhere|VC versions|Choosing the latest|build tools found|BAZEL_VC"

    - name: Compiler Bazel actually wired up
      shell: pwsh
      working-directory: msvc_probe
      run: |
        Get-ChildItem C:/bzl_probe/external -Directory -Filter "*local_config_cc*" -ErrorAction SilentlyContinue |
          ForEach-Object { Write-Host "repo: $($_.Name)" }
        Select-String -Path "C:/bzl_probe/external/*local_config_cc*/*" -Pattern "Tools\\MSVC\\[0-9.]+" -ErrorAction SilentlyContinue |
          ForEach-Object { $_.Matches[0].Value } | Sort-Object -Unique
