# Throwaway probe, not for main: does m4 from BCR still fail on MSVC with C2143
# on `restrict`, and does adding AC_C_RESTRICT (local m4@1.4.21.bcr.5) fix it?
name: Spike - m4 MSVC restrict

on:
  push:
    branches: [ "spike/m4-msvc-restrict" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m4:
    # Already answered by run 36238528754; re-run by hand only.
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, windows-11-arm ]
        m4: [ "1.4.21.bcr.4", "1.4.21.bcr.5" ]
    runs-on: ${{ matrix.os }}
    name: m4 ${{ matrix.m4 }} on ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: spike/m4_msvc_restrict/ws
    steps:
    - uses: actions/checkout@v7
    - uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
    - name: Print MSVC toolset
      shell: pwsh
      working-directory: .
      run: |
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        Write-Host "VS install: $vs"
        Get-ChildItem "$vs\VC\Tools\MSVC" -Name | ForEach-Object { Write-Host "  installed: $_" }
    - name: Build @m4//:m4
      run: |
        printf 'bazel_dep(name = "m4", version = "%s")\n' "${{ matrix.m4 }}" > MODULE.bazel
        registry="file:///$(cygpath -m "$GITHUB_WORKSPACE")/spike/m4_msvc_restrict/registry"
        set +e
        bazel --output_base=C:/b build --keep_going --lockfile_mode=off \
          --registry="$registry" --registry=https://bcr.bazel.build \
          @m4//:m4 2>&1 | tee build.log
        status=${PIPESTATUS[0]}
        echo "::notice title=C2143 count::$(grep -c 'C2143' build.log)"
        grep -E 'error C[0-9]+' build.log | sort -u | head -20
        echo "--- restrict in the generated config.h"
        find "$(bazel --output_base=C:/b info execution_root 2>/dev/null)/bazel-out" \
          -path '*m4+/lib/config.h' -exec grep -n -E '#\s*(undef|define) restrict\b' {} + || true
        exit "$status"

  # The same m4, but the way omniglot builds it: through rules_foreign_cc as an
  # exec-config tool for a cmake() target, with omniglot's own flags.
  omniglot:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, windows-11-arm ]
    runs-on: ${{ matrix.os }}
    name: omniglot cmake module on ${{ matrix.os }}
    env:
      BAZEL_STARTUP_OPTS: "--output_base=C:/bazel_build"
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup_windows
      with:
        bazel_startup_opts: ${{ env.BAZEL_STARTUP_OPTS }}
    - name: Build the cmake module with source-built m4
      run: |
        set +e
        bazel $BAZEL_STARTUP_OPTS build --lockfile_mode=off --keep_going --verbose_failures \
          //modules/cpp_app_with_cmake_dep/... 2>&1 | tee build.log
        status=${PIPESTATUS[0]}
        echo "::notice title=C2143 count::$(grep -c 'C2143' build.log)"
        grep -E 'error C[0-9]+' build.log | sort -u | head -12
        echo "--- C language flags on failing m4 compiles"
        grep -A3 'Compiling .*m4+.* failed' build.log | grep -o -E '/std:[a-z0-9+]+|/Zc:[A-Za-z_]+|/experimental:[a-z0-9]+' | sort | uniq -c
        echo "--- m4 compiles that ran"
        grep -o -E 'Compiling external/m4\+/lib/(regex|spawn[a-z_]*)\.c \[for tool\]' build.log | sort -u | head -5
        exit "$status"
