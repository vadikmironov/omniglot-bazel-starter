name: Renovate

# Self-hosted Renovate. The hosted Mend app cannot run Bazel, so its PRs leave
# MODULE.bazel.lock, go.sum and maven_install.json stale and fail the lock
# freshness gate. This run executes the repo's lock-refresh commands as
# postUpgradeTasks (renovate.json) before each commit, so PRs arrive complete.
# Global settings: .github/renovate-global.json5. Setup: README.md here.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: "'full' logs what would change without touching branches or PRs"
        type: choice
        options: [none, full, lookup, extract]
        default: none
      log-level:
        description: Renovate log level
        type: choice
        options: [info, debug]
        default: info

# One run at a time, and never cancel one mid-commit.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The App secrets live in this environment, restricted to main, so no
    # other branch's workflow can mint the token.
    environment: renovate
    permissions:
      contents: read
    steps:
    # Commits and PRs come from the App, so they trigger CI like any other push.
    - name: Mint a GitHub App installation token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ secrets.RENOVATE_APP_ID }}
        private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

    # Only for the global config file; Renovate clones the repo itself.
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Select dry-run mode
      if: inputs.dry-run != '' && inputs.dry-run != 'none'
      env:
        DRY_RUN: ${{ inputs.dry-run }}
      run: echo "RENOVATE_DRY_RUN=$DRY_RUN" >> "$GITHUB_ENV"

    - name: Run Renovate
      uses: renovatebot/github-action@v46.3.0
      with:
        configurationFile: .github/renovate-global.json5
        token: ${{ steps.app-token.outputs.token }}
      env:
        RENOVATE_REPOSITORIES: ${{ github.repository }}
        LOG_LEVEL: ${{ inputs.log-level || 'info' }}
