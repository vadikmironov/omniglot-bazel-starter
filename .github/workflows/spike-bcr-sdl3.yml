name: Spike - SDL3 BCR module

# TEMPORARY. Builds and tests the sdl3@3.4.16 module staged under
# spike/bcr_sdl3/registry, through a file:// registry, from the consumer
# module in spike/bcr_sdl3/consumer, on the platforms BCR presubmit runs plus
# both Windows ARM64 images. The linux-oracles job regenerates the CMake
# oracles the Linux job diffs the generated build config against.
# Delete once the module is in BCR.

on:
  push:
    branches: [ "spike/bcr-sdl3-probe" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONSUMER: spike/bcr_sdl3/consumer

jobs:
  # The oracles: what SDL's own CMake configure produces on the oldest and
  # the newest Ubuntu BCR presubmit uses. The module's autoconf-generated
  # header is diffed against them in the Linux build job.
  linux-oracles:
    name: CMake oracles are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Generate with SDL's CMake configure
      run: |
        spike/bcr_sdl3/tools/gen_linux_build_config.sh 3.4.16 ubuntu:20.04
        spike/bcr_sdl3/tools/gen_linux_build_config.sh 3.4.16 ubuntu:24.04
    - uses: actions/upload-artifact@v4
      with:
        name: oracles
        path: spike/bcr_sdl3/oracle/
    - name: Compare with the checked-in oracles
      run: |
        git --no-pager diff -- spike/bcr_sdl3/oracle
        if [[ -n "$(git status --porcelain -- spike/bcr_sdl3/oracle)" ]]; then
          echo "::error::the generated oracles differ from the checked-in ones; download the artifact and commit it"
          exit 1
        fi

  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,         setup: linux,   label: "Linux x64" }
          - { runner: windows-2022,          setup: windows, label: "Windows x64, VS 2022" }
          - { runner: windows-11-arm,        setup: windows, label: "Windows ARM64, VS 2022" }
          - { runner: windows-11-vs2026-arm, setup: windows, label: "Windows ARM64, VS 2026" }
          - { runner: macos-latest,          setup: macos,   label: "macOS arm64" }
          - { runner: macos-15-intel,        setup: macos,   label: "macOS x64" }
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup_windows
      if: matrix.setup == 'windows'
      with:
        bazel_startup_opts: --output_base=C:/bazel_build
    - uses: ./.github/actions/setup_linux
      if: matrix.setup == 'linux'
    # macOS runners ship bazelisk; the repo's setup_macos action fetches the
    # omniglot LLVM toolchain, which this module does not use.

    # Every step runs Bazel from the consumer module with the staged
    # registry in front of BCR; the variables are recomputed per step
    # because a step's shell does not outlive it.
    - name: Build the module
      shell: bash
      working-directory: ${{ env.CONSUMER }}
      run: |
        if [[ "$RUNNER_OS" == Windows ]]; then
          startup="--output_base=C:/bazel_build"
          registry="file:///$(cd .. && pwd -W)/registry"
        else
          startup=""
          registry="file://$(cd .. && pwd)/registry"
        fi
        echo "registry: $registry"
        bazel $startup build --verbose_failures \
          --registry="$registry" --registry=https://bcr.bazel.build \
          @sdl3//...

    # The autoconf-generated Linux config has to reproduce what SDL's CMake
    # configure produces on this runner's Ubuntu; the oracle comes from the
    # linux-oracles job.
    - name: Diff the generated Linux config against the CMake oracle
      if: matrix.setup == 'linux'
      shell: bash
      working-directory: ${{ env.CONSUMER }}
      run: |
        registry="file://$(cd .. && pwd)/registry"
        generated="$(bazel cquery --registry="$registry" --registry=https://bcr.bazel.build --output=files @sdl3//:config_h)"
        ../tools/diff_config.sh "$generated" ../oracle/SDL_build_config.ubuntu2404.h

    # SDL's own non-interactive tests, from the module's test/ package, plus
    # anything a consumer-side source next to MODULE.bazel adds.
    - name: Run the module's tests
      shell: bash
      working-directory: ${{ env.CONSUMER }}
      run: |
        if [[ "$RUNNER_OS" == Windows ]]; then
          startup="--output_base=C:/bazel_build"
          registry="file:///$(cd .. && pwd -W)/registry"
        else
          startup=""
          registry="file://$(cd .. && pwd)/registry"
        fi
        targets="@sdl3//..."
        if ls ./*.c >/dev/null 2>&1; then
          targets="$targets //..."
        fi
        bazel $startup test --verbose_failures --test_output=errors \
          --registry="$registry" --registry=https://bcr.bazel.build \
          $targets
