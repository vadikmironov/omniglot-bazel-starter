name: Spike - SDL3 BCR module

# TEMPORARY. Builds and tests the sdl3@3.4.16 module staged under
# spike/bcr_sdl3/registry, through a file:// registry, on the platforms BCR
# presubmit runs plus both Windows ARM64 images, from consumer modules of
# different shapes. The linux-oracles job regenerates the CMake oracles the
# Linux job diffs the generated build config against.
# Delete once the module is in BCR.

on:
  push:
    branches: [ "spike/bcr-sdl3-probe" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The oracles: what SDL's own CMake configure produces on the oldest and
  # the newest Ubuntu BCR presubmit uses.
  linux-oracles:
    name: CMake oracles are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Generate with SDL's CMake configure
      run: |
        spike/bcr_sdl3/tools/gen_linux_build_config.sh 3.4.16 ubuntu:20.04
        spike/bcr_sdl3/tools/gen_linux_build_config.sh 3.4.16 ubuntu:24.04
    - uses: actions/upload-artifact@v4
      with:
        name: oracles
        path: spike/bcr_sdl3/oracle/
    - name: Compare with the checked-in oracles
      run: |
        git --no-pager diff -- spike/bcr_sdl3/oracle
        if [[ -n "$(git status --porcelain -- spike/bcr_sdl3/oracle)" ]]; then
          echo "::error::the generated oracles differ from the checked-in ones; download the artifact and commit it"
          exit 1
        fi

  # The oldest image BCR presubmit uses, whose toolchain is of the GCC 9 era.
  # The whole Linux build config comes from link probes, so the compiler
  # decides what the module compiles. debian11 is not reproduced here: that
  # release has left Debian's mirrors, and what remains on the archive
  # conflicts with the packages its image ships. BCR runs its own image.
  old-images:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:20.04", label: "ubuntu2004 container" }
    steps:
    - name: Install a toolchain and bazelisk
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends \
          build-essential ca-certificates curl git python3 unzip zip
        curl -fsSL -o /usr/local/bin/bazel \
          https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64
        chmod +x /usr/local/bin/bazel
    - uses: actions/checkout@v7
    - name: Build and test the module
      shell: bash
      working-directory: spike/bcr_sdl3/consumer
      run: |
        registry="file://$(cd .. && pwd)/registry"
        bazel version
        bazel test --verbose_failures --test_output=errors \
          --registry="$registry" --registry=https://bcr.bazel.build \
          @sdl3//...

  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,         setup: linux,   consumer: consumer, bazel: "",      label: "Linux x64" }
          # Bazel 7 rejects `common` options a command does not take, such as the
          # repository .bazelrc's --downloader_config for `bazel version`; a
          # consumer module should not read that file anyway.
          - { runner: ubuntu-latest,         setup: linux,   consumer: consumer, bazel: "7.4.0", rc: "--ignore_all_rc_files", label: "Linux x64, Bazel 7.4.0" }
          - { runner: windows-2022,          setup: windows, consumer: consumer, bazel: "",      label: "Windows x64, VS 2022" }
          - { runner: windows-11-arm,        setup: windows, consumer: consumer, bazel: "",      label: "Windows ARM64, VS 2022" }
          - { runner: windows-11-vs2026-arm, setup: windows, consumer: consumer, bazel: "",      label: "Windows ARM64, VS 2026" }
          - { runner: macos-latest,          setup: macos,   consumer: consumer, bazel: "",      label: "macOS arm64" }
          - { runner: macos-15-intel,        setup: macos,   consumer: consumer, bazel: "",      label: "macOS x64" }
          - { runner: macos-latest,          setup: macos,   consumer: consumer_rules_cc_only, bazel: "", label: "macOS arm64, consumer with rules_cc only" }
          - { runner: macos-latest,          setup: macos,   consumer: consumer_llvm,          bazel: "", label: "macOS arm64, consumer on toolchains_llvm" }
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup_windows
      if: matrix.setup == 'windows'
      with:
        bazel_startup_opts: --output_base=C:/bazel_build
    - uses: ./.github/actions/setup_linux
      if: matrix.setup == 'linux'
    # macOS runners ship bazelisk; the repo's setup_macos action fetches the
    # omniglot LLVM toolchain, which this module does not use.

    # Every step runs Bazel from the consumer module with the staged
    # registry in front of BCR; the variables are recomputed per step
    # because a step's shell does not outlive it.
    - name: Build the module
      env:
        USE_BAZEL_VERSION: ${{ matrix.bazel }}
      shell: bash
      working-directory: spike/bcr_sdl3/${{ matrix.consumer }}
      run: |
        [[ -z "$USE_BAZEL_VERSION" ]] && unset USE_BAZEL_VERSION
        if [[ "$RUNNER_OS" == Windows ]]; then
          startup="--output_base=C:/bazel_build"
          registry="file:///$(cd .. && pwd -W)/registry"
        else
          startup="${{ matrix.rc }}"
          registry="file://$(cd .. && pwd)/registry"
        fi
        bazel $startup version
        bazel $startup build --verbose_failures \
          --registry="$registry" --registry=https://bcr.bazel.build \
          @sdl3//...

    # The autoconf-generated Linux config has to reproduce what SDL's CMake
    # configure produces on this runner's Ubuntu.
    - name: Diff the generated Linux config against the CMake oracle
      env:
        USE_BAZEL_VERSION: ${{ matrix.bazel }}
      if: matrix.setup == 'linux'
      shell: bash
      working-directory: spike/bcr_sdl3/${{ matrix.consumer }}
      run: |
        [[ -z "$USE_BAZEL_VERSION" ]] && unset USE_BAZEL_VERSION
        registry="file://$(cd .. && pwd)/registry"
        generated="$(bazel ${{ matrix.rc }} cquery --registry="$registry" --registry=https://bcr.bazel.build --output=files @sdl3//:config_h)"
        ../tools/diff_config.sh "$generated" ../oracle/SDL_build_config.ubuntu2404.h

    - name: Run the module's tests
      env:
        USE_BAZEL_VERSION: ${{ matrix.bazel }}
      shell: bash
      working-directory: spike/bcr_sdl3/${{ matrix.consumer }}
      run: |
        [[ -z "$USE_BAZEL_VERSION" ]] && unset USE_BAZEL_VERSION
        if [[ "$RUNNER_OS" == Windows ]]; then
          startup="--output_base=C:/bazel_build"
          registry="file:///$(cd .. && pwd -W)/registry"
        else
          startup="${{ matrix.rc }}"
          registry="file://$(cd .. && pwd)/registry"
        fi
        targets="@sdl3//..."
        if ls ./*.c >/dev/null 2>&1; then
          targets="$targets //..."
        fi
        bazel $startup test --verbose_failures --test_output=errors \
          --registry="$registry" --registry=https://bcr.bazel.build \
          $targets

    # What BCR presubmit runs as bcr_test_module: a separate module that links
    # @sdl3. BCR points it at the extracted source with local_path_override;
    # here the module comes from the staged registry instead.
    - name: Build and test the test module
      shell: bash
      working-directory: spike/bcr_sdl3
      env:
        USE_BAZEL_VERSION: ${{ matrix.bazel }}
      run: |
        [[ -z "$USE_BAZEL_VERSION" ]] && unset USE_BAZEL_VERSION
        if [[ "$RUNNER_OS" == Windows ]]; then
          startup="--output_base=C:/bazel_test_module"
          registry="file:///$(pwd -W)/registry"
        else
          startup="${{ matrix.rc }}"
          registry="file://$(pwd)/registry"
        fi
        scratch="$(mktemp -d)"
        cp registry/modules/sdl3/3.4.16/overlay/test_module/BUILD.bazel \
           registry/modules/sdl3/3.4.16/overlay/test_module/smoke.cc "$scratch"/
        cat > "$scratch/MODULE.bazel" <<'EOF'
        bazel_dep(name = "rules_cc", version = "0.2.16")
        bazel_dep(name = "sdl3", version = "3.4.16")
        EOF
        cd "$scratch"
        bazel $startup test --verbose_failures --test_output=all \
          --registry="$registry" --registry=https://bcr.bazel.build \
          //...
