name: Spike - SDL3 BCR module probe

# TEMPORARY. Two questions from review: do the remaining NONINTERACTIVE SDL
# tests run under Bazel on every platform, and does a macOS consumer that
# declares rules_cc before (or without) apple_support still build sdl3.

on:
  push:
    branches: [ "spike/bcr-sdl3-probe" ]

jobs:
  tests:
    name: New tests, ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,         setup: linux,   label: "Linux x64" }
          - { runner: windows-2022,          setup: windows, label: "Windows x64, VS 2022" }
          - { runner: windows-11-arm,        setup: windows, label: "Windows ARM64, VS 2022" }
          - { runner: windows-11-vs2026-arm, setup: windows, label: "Windows ARM64, VS 2026" }
          - { runner: macos-latest,          setup: macos,   label: "macOS arm64" }
          - { runner: macos-15-intel,        setup: macos,   label: "macOS x64" }
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup_windows
      if: matrix.setup == 'windows'
      with:
        bazel_startup_opts: --output_base=C:/bazel_build
    - uses: ./.github/actions/setup_linux
      if: matrix.setup == 'linux'
    - name: Run the new tests one by one
      shell: bash
      working-directory: spike/bcr_sdl3/consumer
      run: |
        if [[ "$RUNNER_OS" == Windows ]]; then
          startup="--output_base=C:/bazel_build"
          registry="file:///$(cd .. && pwd -W)/registry"
        else
          startup=""
          registry="file://$(cd .. && pwd)/registry"
        fi
        status=0
        for t in testprocess; do
          echo "::group::$t"
          if bazel $startup test --verbose_failures --test_output=all \
              --registry="$registry" --registry=https://bcr.bazel.build \
              "@sdl3//test:$t"; then
            echo "RESULT $t PASS"
          else
            echo "RESULT $t FAIL"; status=1
          fi
          echo "::endgroup::"
        done
        exit $status


    # Windows ARM64: each testprocess case on its own, to find the one that
    # takes the process down.
    - name: testprocess case by case
      if: contains(matrix.label, 'ARM64')
      shell: bash
      working-directory: spike/bcr_sdl3/consumer
      run: |
        startup="--output_base=C:/bazel_build"
        registry="file:///$(cd .. && pwd -W)/registry"
        for c in process_testArguments process_testExitCode process_testInheritedEnv process_testNewEnv process_testKill process_testStdinToStdout process_testStdinToStderr process_testSimpleStdinToStdout process_testMultiprocessStdinToStdout process_testWriteToFinishedProcess process_testNonExistingExecutable process_testBatBadButVulnerability process_testFileRedirection process_testWindowsCmdline process_testWindowsCmdlinePrecedence; do
          out="$(bazel $startup test --registry="$registry" --registry=https://bcr.bazel.build \
            --test_output=all --test_arg=--filter --test_arg=$c @sdl3//test:testprocess 2>&1)"
          if echo "$out" | grep -q "PASSED in"; then echo "CASE $c PASS"; else
            echo "CASE $c FAIL"; echo "$out" | grep -E "bazel_testprocess_main|Assert '.*': Failed|>>> Test" | tail -4; fi
        done
