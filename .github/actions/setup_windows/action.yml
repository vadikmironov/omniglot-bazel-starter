name: 'Setup Windows for Bazel'
description: 'Common Windows setup steps for Bazel builds'
inputs:
  bazel_startup_opts:
    description: 'Bazel startup options'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: true
        repository-cache: true
    # Bazel takes the highest-numbered toolset installed, not the install
    # default, and this image carries three VC versions. Printing the selection
    # to make it easier to explain issues due to toolset changes when new runner
    # image appears (see the /std note in .bazelrc).
    - name: Print MSVC toolset
      shell: pwsh
      run: |
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        Write-Host "VS install: $vs"
        Write-Host "install default: $(Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt")"
        Get-ChildItem "$vs\VC\Tools\MSVC" -Name | ForEach-Object { Write-Host "  installed: $_" }
    - name: Print debug info
      shell: pwsh
      run: |
        Write-Host "=== PowerShell version ==="
        Write-Host "Version: $($PSVersionTable.PSVersion)"
        Write-Host "Edition: $($PSVersionTable.PSEdition)"
        Write-Host "=== Git Bash version ==="
        & bash --version | Select-Object -First 1
        Write-Host "=== Bazel version ==="
        & bazel ${{ inputs.bazel_startup_opts }} version
        Write-Host "=== Bazel info ==="
        & bazel ${{ inputs.bazel_startup_opts }} info
